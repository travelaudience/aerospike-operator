version: 2.1

orbs:
  continuation: circleci/continuation@2.1

jobs:
  get_dirs:
    steps:
      run: find . -mindepth 1 -maxdepth 1 -type d ! -name '.*' -printf '%f\n' | jq -R '{ "dirs": [ inputs ] | join(" ") }' >parameters.json

workflows:
  setup:
    jobs:
      - get_dirs
      - continuation/continue:
        parameters: parameters.json
