version: 2.1

setup: true

orbs:
  continuation: circleci/continuation@2.0

jobs:
  get_dirs:
    docker:
      - image: cimg/base:2024.10
    steps:
      - run: |
          find . -mindepth 1 -maxdepth 1 -type d ! -name '.*' -printf '%f\n' | jq -R '{ "dirs": [ inputs ] | join(" ") }' >parameters.json
      - continuation/continue:
          configuration_path: .circleci/continue_config.yml
          parameters: parameters.json

workflows:
  setup:
    jobs:
      - get_dirs
